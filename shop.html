<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<title>Shop · Lawn &amp; Loom</title>
<meta name="description" content="The Bahar '26 collection: unstitched lawn suits, ready-to-wear kurtas and co-ords, and dupattas. Prices on the page, cash on delivery.">
<script type="module" src="/src/main.js"></script>
</head>
<body data-barba="wrapper">
<!-- @include header -->
<main id="main" data-barba="container" data-barba-namespace="shop">

  <section class="shop-head" aria-labelledby="shop-title">
    <div class="container">
      <div class="shop-head-row">
        <div>
          <p class="eyebrow"><b>Bahar '26</b> · <span data-piece-count></span></p>
          <h1 id="shop-title" class="display" data-rise>The <em>collection</em></h1>
        </div>
        <div class="view-toggle" role="group" aria-label="View">
          <button type="button" data-view="grid" aria-pressed="true">Photos</button>
          <button type="button" data-view="aisle" aria-pressed="false">Walk the aisle</button>
        </div>
      </div>
      <div class="filters" role="group" aria-label="Filter by type" data-filters></div>
    </div>
  </section>

  <section class="aisle" data-aisle aria-label="The collection as a cloth market aisle">
    <div class="aisle-sticky">
      <canvas data-aisle-canvas aria-hidden="true"></canvas>
      <div class="aisle-labels" data-aisle-labels></div>
      <p class="aisle-hint label">Scroll to walk the aisle · click a stack</p>
    </div>
  </section>

  <section class="section-tight shop-grid" data-grid-wrap aria-label="All products">
    <div class="container">
      <div class="p-grid" data-grid></div>
      <p class="empty" data-empty hidden>Nothing in this section yet.</p>
    </div>
  </section>

</main>
<!-- @include footer -->
</body>
</html>
