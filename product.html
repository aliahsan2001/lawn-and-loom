<!doctype html>
<html lang="en">
<head>
<!-- @include head -->
<title>Product · Lawn &amp; Loom</title>
<meta name="description" content="Printed and embroidered lawn from Lawn & Loom: photographs of every colourway, a 3D swatch of the fabric, sizes and cash on delivery.">
<script type="module" src="/src/main.js"></script>
</head>
<body data-barba="wrapper">
<!-- @include header -->
<main id="main" data-barba="container" data-barba-namespace="product">
  <div class="container">
    <div class="pd">
      <div class="pd-media">
        <div class="pd-thumbs" role="group" aria-label="Views" data-thumbs></div>
        <div class="pd-stage" data-stage>
          <div class="pd-photos" data-photos></div>
          <div class="pd-fabric" data-fabric hidden>
            <canvas data-drape aria-hidden="true"></canvas>
            <div class="pd-flat" data-flat></div>
            <div class="loupe" data-loupe aria-hidden="true"><span class="loupe-label">The weave, up close</span></div>
            <p class="pd-hint">Drag to turn the swatch</p>
            <button type="button" class="zoom-btn" data-zoom aria-pressed="false">Look closer</button>
          </div>
        </div>
      </div>
      <div class="pd-info" data-info></div>
    </div>
  </div>
  <section class="section-tight rule" aria-labelledby="more-title">
    <div class="container">
      <div class="section-head"><h2 id="more-title" class="display">You might <em>also like</em></h2><a class="text-link" href="/shop">The whole collection →</a></div>
      <div class="p-grid" data-more></div>
    </div>
  </section>
</main>
<!-- @include footer -->
</body>
</html>
